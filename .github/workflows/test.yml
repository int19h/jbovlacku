name: Prototype tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-native:
    runs-on: ubuntu-24.04
    # In 21 recent attempts this part took 16 to 53 minutes, with a median of 25.
    # The Rust test step alone took 14 to 50 minutes.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /build/jbovlacku/target
      JVC_TEST_ROOT: /build/jbovlacku/tests
      JVC_STATE_PARITY_DIR: /build/jbovlacku/state-parity
      JVC_SHUN_PARITY_DIR: /build/jbovlacku/shun-parity
      JVC_PREPARATION_PARITY_DIR: /build/jbovlacku/preparation-parity
      JVC_WORD_RESULT_PARITY_DIR: /build/jbovlacku/word-result-parity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Prepare test files
        run: |
          sudo mkdir -p /build/jbovlacku
          sudo chown "$(id -u):$(id -g)" /build/jbovlacku
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --jobs 2
      - name: Format Rust
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test format, causal state, and ranking
        run: cargo test --workspace --locked --jobs 2 -- --test-threads=2
      # The Rust tests write the native parity corpora into the four parity
      # directories above. The parity job below reads them from this artifact.
      - name: Upload native parity corpora
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-parity-corpora
          path: |
            /build/jbovlacku/state-parity
            /build/jbovlacku/shun-parity
            /build/jbovlacku/preparation-parity
            /build/jbovlacku/word-result-parity
          if-no-files-found: error
          retention-days: 1

  wasm-and-browser-parity:
    needs: rust-native
    runs-on: ubuntu-24.04
    # In 21 recent attempts this part took 5 to 15 minutes, with a median of 7.
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /build/jbovlacku/target
      JVC_TEST_ROOT: /build/jbovlacku/tests
      JVC_STATE_PARITY_DIR: /build/jbovlacku/state-parity
      JVC_SHUN_PARITY_DIR: /build/jbovlacku/shun-parity
      JVC_PREPARATION_PARITY_DIR: /build/jbovlacku/preparation-parity
      JVC_WORD_RESULT_PARITY_DIR: /build/jbovlacku/word-result-parity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Prepare test files
        run: |
          sudo mkdir -p /build/jbovlacku
          sudo chown "$(id -u):$(id -g)" /build/jbovlacku
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --jobs 2
      - name: Install JavaScript and browser tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Download native parity corpora
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-parity-corpora
          path: /build/jbovlacku
      - name: Compare native and Wasm float kernel results
        timeout-minutes: 10
        run: node scripts/test-f64-kernel-parity.mjs
      - name: Build shared WebAssembly
        run: npm run build:core
      - name: Compare native and browser format results
        run: python3 crates/jvc-core/tests/run-browser-parity.py
      - name: Compare native and browser causal state and ranking
        run: node scripts/test-state-parity.mjs
      - name: Compare native and WebAssembly session preparation
        run: node scripts/test-f64-preparation-parity.mjs
      - name: Compare native and WebAssembly word results
        run: node scripts/test-f64-word-results-parity.mjs
      - name: Compare native and WebAssembly float row bits
        run: node scripts/test-f64-row-parity.mjs

  typescript-and-applications:
    runs-on: ubuntu-24.04
    # In 21 recent attempts this part took 9 to 22 minutes, with a median of 15.
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /build/jbovlacku/target
      JVC_TEST_ROOT: /build/jbovlacku/tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Prepare test files
        run: |
          sudo mkdir -p /build/jbovlacku
          sudo chown "$(id -u):$(id -g)" /build/jbovlacku
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --jobs 2
      - name: Install JavaScript and browser tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build shared WebAssembly
        run: npm run build:core
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test core session results and cache
        run: npx tsx --test --test-concurrency=2 packages/core/test/*.test.ts
      - name: Test TypeScript morphology
        run: npm run test:morphology
      - name: Shared lexical search tests
        run: npm run test:search
      - name: Test storage and import
        run: |
          npm run test:service
          npx tsx --test apps/server/test/*.test.ts
          npx tsx --test packages/importer/test/*.test.ts
      - name: Test synthetic activity kit
        run: npm run test:synthetic
      - name: Build standalone and browser applications
        run: |
          npm run build:server
          npm run build:web
      - name: Test the standalone server
        run: npm run test:adapters
      - name: Test browser model units
        run: npm run test:web-unit

  chromium-browser:
    runs-on: ubuntu-24.04
    # Chromium took about 30 to 43 minutes, plus up to 15 minutes for setup.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /build/jbovlacku/target
      JVC_TEST_ROOT: /build/jbovlacku/tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Prepare test files
        run: |
          sudo mkdir -p /build/jbovlacku
          sudo chown "$(id -u):$(id -g)" /build/jbovlacku
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --jobs 2
      - name: Install JavaScript and browser tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build shared WebAssembly
        run: npm run build:core
      - name: Build browser application
        run: npm run build:web
      - name: Test browser behavior
        run: npm run test:web -- --project chromium

  firefox-editing-and-authoring:
    runs-on: ubuntu-24.04
    # Firefox took about 10 minutes, plus about 4 minutes for setup and builds.
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /build/jbovlacku/target
      JVC_TEST_ROOT: /build/jbovlacku/tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Prepare test files
        run: |
          sudo mkdir -p /build/jbovlacku
          sudo chown "$(id -u):$(id -g)" /build/jbovlacku
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --jobs 2
      - name: Install JavaScript and browser tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps firefox
      - name: Build shared WebAssembly
        run: npm run build:core
      - name: Build browser application
        run: npm run build:web
      - name: Test Firefox editing and authoring
        run: npm run test:web -- --project firefox-editor --project firefox-authoring --project firefox-wizard

  standalone-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JVC_CONTAINER_ENGINE: docker
      JVC_CONTAINER_IMAGE: jbovlacku:ci
      JVC_CONTAINER_TEST_DIR: /tmp/jbovlacku-container-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build standalone image
        run: bash scripts/container-build.sh
      - name: Test persistent volume and shutdown
        run: bash scripts/container-smoke.sh

[workspace]
members = ["crates/jvc-core", "crates/jvc-state", "crates/jvc-rank", "crates/jvc-runtime", "crates/jvc-carrier"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

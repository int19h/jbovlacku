[package]
name = "jvc-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jvc-core = { path = "../jvc-core" }
jvc-state = { path = "../jvc-state" }
jvc-rank = { path = "../jvc-rank" }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "=0.3.2"
wasm-bindgen = "=0.2.105"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode"] }
regex-syntax = { version = "=0.8.10", default-features = false, features = ["std", "unicode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jvc-carrier = { path = "../jvc-carrier" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "=3.23.0"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "=0.2.190"
